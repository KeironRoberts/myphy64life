<html>
  <head>
    <link rel="stylesheet" href="homepage_style.css" />
  </head>
  <body>
    <script type="module" src="homepage-auth.js"></script>
    <!-- Navigation Bar -->
    <nav class="navbar">
      <div class="navbar_container">
        <div class="logo-menu-group">
          <a href="/" class="logo">
            <img src="images/logo.png" alt="Logo" />
          </a>

          <ul class="navbar__menu">
            <li class="navbar_homepage"><a href="#">PHY64LIFE</a></li>
            <li class="navbar_about"><a href="#">About</a></li>
            <li class="navbar_contact"><a href="#">Contact Us</a></li>
          </ul>
        </div>

        <div class="profile-box">
          <span class="username" id="profileUsername" style="cursor: pointer; text-decoration: underline;" title="Click to change username">Loading...</span>
          <img id="profilePicture" class="pfp" alt="Profile Picture" style="cursor: pointer;" />
          <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </div>
    </nav>

    <!-- Profile Picture Selector Modal -->
    <div id="profileModal" class="modal hidden">
      <div class="modal-content">
        <h2>Choose Profile Picture</h2>
        <div id="profileGrid" class="profile-grid"></div>
        <button id="closeModalBtn" class="modal-close-btn">Close</button>
      </div>
    </div>

    <!-- Username Change Modal -->
    <div id="usernameModal" class="modal hidden">
      <div class="modal-content">
        <h2>Change Username</h2>
        <input type="text" id="newUsernameInput" placeholder="Enter new username" class="modal-input" />
        <div id="usernameError" class="error-message"></div>
        <div class="modal-buttons">
          <button id="saveUsernameBtn" class="modal-save-btn">Save</button>
          <button id="closeUsernameModalBtn" class="modal-close-btn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Friends List Modal -->
    <div id="friendsListModal" class="modal hidden">
      <div class="modal-content">
        <h2>Friends List</h2>
        <div id="friendsList" class="friends-list-content">
          <p class="loading-text">Loading friends...</p>
        </div>
        <button id="closeFriendsListBtn" class="modal-close-btn">Close</button>
      </div>
    </div>

    <!-- Search Users Modal -->
    <div id="searchUsersModal" class="modal hidden">
      <div class="modal-content">
        <h2>Search Users</h2>
        <input type="text" id="searchUserInput" placeholder="Enter username to search" class="modal-input" />
        <button id="searchBtn" class="modal-save-btn">Search</button>
        <div id="searchResults" class="search-results">
          <p class="loading-text">Enter a username to search</p>
        </div>
        <button id="closeSearchModalBtn" class="modal-close-btn">Close</button>
      </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboardModal" class="modal hidden">
      <div class="modal-content leaderboard-modal">
        <h2>High Score Leaderboard</h2>
        <div id="leaderboardTable" class="leaderboard-table">
          <p class="loading-text">Loading leaderboard...</p>
        </div>
        <button id="closeLeaderboardBtn" class="modal-close-btn">Close</button>
      </div>
    </div>

    <!-- Friends List -->
    <div class="friends-list">
      <h3>Friends</h3>
      <button id="viewFriendsBtn" class="friends-action-btn">View Friends</button>
      <button id="searchUsersBtn" class="friends-action-btn">Search Users</button>
      <button id="viewLeaderboardBtn" class="friends-action-btn">Leaderboard</button>
    </div>

    <!-- GameBox -->
    <div class="gamebox">
      <a href="game/game.html" class="game-link-image">
        <img src="images/parabola.png" alt="Play Game" class="game-image" />
      </a>
    </div>
  </body>
</html>
