<!-- game.html - html structure for gamepage-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="game.css" />
    <link rel="stylesheet" href="animations.css" />
    <link rel="stylesheet" href="problemSolver.css" />
  </head>
  <body>
    <div
      id="loading-overlay"
      style="
        position: fixed;
        z-index: 9999;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(30, 40, 30, 0.97);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 2.2rem;
        letter-spacing: 0.1em;
        transition: opacity 0.4s;
      "
    >
      Loading game…
    </div>
    <div id="problem-container">
      <canvas id="gameCanvas" tabindex="0"></canvas>
    </div>

    <script type="module" src="templates.js"></script>
    <script type="module" src="config.js"></script>
    <script type="module" src="animations.js"></script>
    <script type="module" src="problemSolver.js"></script>
    <script>
      // Wait for all scripts, images, and DOM
      window.addEventListener('load', () => {
        // Wait a tick for any late async
        setTimeout(() => {
          const overlay = document.getElementById('loading-overlay');
          if (overlay) {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.remove(), 400);
          }
          // Signal to ProblemSolver that loading is done
          window.__gameLoaded = true;
          window.dispatchEvent(new Event('gameLoaded'));
        }, 100);
      });
    </script>
  </body>
</html>
